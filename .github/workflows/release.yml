name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v2.0.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Verify release commit is on main
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tag must point to a commit on origin/main." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install project and release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Type-check Pi adapter
        working-directory: adapters/pi
        run: |
          npm ci --no-audit --no-fund
          npm run check

      - name: Verify tag and repository versions
        run: python scripts/verify_release.py --tag "${{ steps.tag.outputs.tag }}"

      - name: Lint Python sources
        run: python -m ruff check src tests scripts/build_release.py scripts/verify_release.py

      - name: Run tests
        run: python -m pytest

      - name: Build wheel and source distribution
        run: python -m build --wheel --sdist --outdir dist

      - name: Smoke-test and verify Python artifacts
        run: python scripts/verify_release.py --artifacts-dir dist --require-sdist --smoke-wheel

      - name: Build Codex/Claude plugin marketplace bundle
        run: python scripts/build_release.py --output-dir dist

      - name: Verify Codex/Claude plugin marketplace bundle
        run: python scripts/verify_release.py --bundle-dir dist

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum -- *.whl *.tar.gz *.zip > SHA256SUMS

      - name: Verify SHA256 checksums
        run: python scripts/verify_release.py --checksums-dir dist

      - name: Create or update GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/*.zip dist/SHA256SUMS --clobber

      - name: Prepare Python artifacts for PyPI
        shell: bash
        run: |
          mkdir -p pypi-dist
          cp dist/*.whl dist/*.tar.gz pypi-dist/

      - name: Publish wheel and source distribution to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: pypi-dist/
