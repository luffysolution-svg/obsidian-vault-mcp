name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Verify repository release hygiene
        run: python scripts/verify_release.py

      - name: Lint Python sources
        run: python -m ruff check src tests scripts/verify_release.py

      - name: Run tests
        run: python -m pytest

      - name: Build wheel
        run: python -m build --wheel --outdir dist

      - name: Smoke-test wheel installation
        run: python scripts/verify_release.py --artifacts-dir dist --smoke-wheel

  pi-adapter:
    name: Type-check Pi extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Pi adapter dependencies
        working-directory: adapters/pi
        run: npm install --no-audit --no-fund

      - name: Type-check Pi adapter
        working-directory: adapters/pi
        run: npm run check

  package:
    name: Build release artifacts
    runs-on: ubuntu-latest
    needs: [test, pi-adapter]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: python -m pip install "build>=1.2,<2"

      - name: Build wheel and source distribution
        run: python -m build --wheel --sdist --outdir dist

      - name: Verify Python artifacts
        run: python scripts/verify_release.py --artifacts-dir dist --require-sdist

      - name: Build Codex plugin bundle
        shell: pwsh
        run: ./scripts/build_release.ps1

      - name: Verify Codex plugin bundle
        run: python scripts/verify_release.py --bundle-dir dist

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum -- *.whl *.tar.gz *.zip > SHA256SUMS

      - name: Verify SHA256 checksums
        run: python scripts/verify_release.py --checksums-dir dist

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-vault-mcp-release
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
