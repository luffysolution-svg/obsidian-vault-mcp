name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.30"
          enable-cache: false

      - name: Install project and test dependencies
        run: uv sync --locked --all-extras

      - name: Verify repository release hygiene
        run: uv run python scripts/verify_release.py

      - name: Lint Python sources
        run: uv run python -m ruff check src tests scripts/build_release.py scripts/release_guard.py scripts/verify_release.py

      - name: Run tests
        run: uv run python -m pytest

      - name: Build wheel
        run: uv run python -m build --wheel --outdir dist

      - name: Smoke-test wheel installation
        run: uv run python scripts/verify_release.py --artifacts-dir dist --smoke-wheel

  pi-adapter:
    name: Type-check Pi extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install Pi adapter dependencies
        working-directory: adapters/pi
        run: npm ci --no-audit --no-fund

      - name: Type-check Pi adapter
        working-directory: adapters/pi
        run: npm run check

  package:
    name: Build release artifacts
    runs-on: ubuntu-latest
    needs: [test, pi-adapter]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.30"
          enable-cache: false

      - name: Install locked project and build tooling
        run: uv sync --locked --all-extras

      - name: Build wheel and source distribution
        run: uv run python -m build --wheel --sdist --outdir dist

      - name: Verify Python artifacts
        run: uv run python scripts/verify_release.py --artifacts-dir dist --require-sdist

      - name: Build Codex/Claude plugin marketplace bundle
        run: uv run python scripts/build_release.py --output-dir dist

      - name: Verify Codex/Claude plugin marketplace bundle
        run: uv run python scripts/verify_release.py --bundle-dir dist

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum -- *.whl *.tar.gz *.zip > SHA256SUMS

      - name: Verify SHA256 checksums
        run: uv run python scripts/verify_release.py --checksums-dir dist

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: obsidian-vault-mcp-release
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
