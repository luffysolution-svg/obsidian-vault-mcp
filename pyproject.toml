[build-system]
requires = ["setuptools>=77,<81", "wheel>=0.43,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "zotero-obsidian-mcp"
version = "2.0.0"
description = "Local MCP server for a Zotero + MinerU + Obsidian literature pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Obsidian Vault MCP Contributors" }
]
keywords = ["obsidian", "zotero", "mineru", "literature", "markdown", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "mcp>=1.10,<2",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "ruff>=0.13,<0.15",
]

[project.scripts]
obsidian-vault-mcp = "obsidian_vault_mcp.interfaces.cli.main:main"

[project.urls]
Homepage = "https://github.com/luffysolution-svg/obsidian-vault-mcp"
Repository = "https://github.com/luffysolution-svg/obsidian-vault-mcp"
Issues = "https://github.com/luffysolution-svg/obsidian-vault-mcp/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["obsidian_vault_mcp*"]

[tool.setuptools.package-data]
"obsidian_vault_mcp.interfaces.agent_install" = ["pi_extension.ts"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
